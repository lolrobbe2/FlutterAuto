name: flutter_auto_core
description: "Reusable Flutter automotive head-unit framework."
version: 0.1.0

environment:
  sdk: ^3.13.4
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Video decoding
  ffmpeg_kit_flutter_new_video: ^2.5.7

  # Protocol and generated protobuf messages
  protobuf: ^6.1.0
  fixnum: ^1.1.1
  archive: ^4.5.2

  # Transport, security and utilities
  logging: ^1.3.0
  openssl_bindings: ^1.3.0
  path: ^1.9.1
  http: ^1.6.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/security/headunit-key.pem
    - assets/security/headunit-cert.pem
